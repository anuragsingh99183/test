name: Windows RDP via Tailscale (GitHub Hosted Runner)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Clone repository to Desktop
        shell: pwsh
        run: |
         $desktop = "C:\Users\runneradmin\Desktop"
         $repoUrl = "https://github.com/${{ github.repository }}.git"

         cd $desktop
         git clone $repoUrl
    
      - name: Install Tailscale
        shell: pwsh
        run: |
          winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements

      - name: Connect runner to Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          # Bring up Tailscale (ephemeral node recommended via key settings)
          & $ts up --authkey $env:TAILSCALE_AUTHKEY --hostname "gh-runner-rdp" --accept-dns=false

          # Show Tailscale IPv4 for RDP
          $ip = & $ts ip -4
          Write-Host "Tailscale IPv4: $ip"

      - name: Enable RDP + firewall
        shell: pwsh
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0

          # Allow RDP through Windows Firewall
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Enforce Network Level Authentication (recommended)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set runneradmin password (random) and print credentials
        shell: pwsh
        run: |
          # Generate a strong random password
          Add-Type -AssemblyName System.Web
          $pwd = [System.Web.Security.Membership]::GeneratePassword(24, 6)

          # Mask it in logs after printing is not possible, so we mask first then print.
          # This will hide the password value in subsequent log lines if repeated.
          Write-Host "::add-mask::$pwd"

          # Set password for the admin user on GitHub hosted Windows runner
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString $pwd -AsPlainText -Force)

          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $ip = & $ts ip -4

          Write-Host ""
          Write-Host "==== RDP DETAILS ===="
          Write-Host "Host (Tailscale IP): $ip"
          Write-Host "Username: runneradmin"
          Write-Host "Password: $pwd"
          Write-Host "====================="
          Write-Host ""

      - name: Keep runner alive for RDP (2 hours)
        shell: pwsh
        run: |
          Write-Host "Runner will stay alive for 2 hours. Cancel the job when done."
          Start-Sleep -Seconds 7200

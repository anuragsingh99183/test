name: Windows RDP via Tailscale (GitHub Hosted Runner)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Clone repository to Desktop
        shell: pwsh
        run: |
          $desktop = "C:\Users\runneradmin\Desktop"
          $repoUrl = "https://github.com/${{ github.repository }}.git"

          Set-Location $desktop
          git clone $repoUrl

      - name: Install Tailscale
        shell: pwsh
        run: |
          winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements

      - name: Connect runner to Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          & $ts up --authkey $env:TAILSCALE_AUTHKEY --hostname "gh-runner-rdp" --accept-dns=false

          $ip = & $ts ip -4
          Write-Host "Tailscale IPv4: $ip"

      - name: Enable RDP + firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set runneradmin password (fixed from secret) and print RDP details
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PASSWORD) {
            throw "Missing secret: RDP_PASSWORD"
          }

          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force)

          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $ip = & $ts ip -4

          Write-Host ""
          Write-Host "==== RDP DETAILS ===="
          Write-Host "Host (Tailscale IP): $ip"
          Write-Host "Username: runneradmin"
          Write-Host "Password: (set from secret RDP_PASSWORD)"
          Write-Host "====================="
          Write-Host ""

      - name: Keep runner alive for RDP (2 hours)
        shell: pwsh
        run: |
          Write-Host "Runner will stay alive for 2 hours. Cancel the job when done."
          Start-Sleep -Seconds 7200
